[project]
name = "tempopb"
version = "0.1.0"
description = "Reproducibility code for allocation-risk auditing in repeated participatory budgeting"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pabutools>=1.2.3",
    "pandas>=3.0.3",
    "reportlab>=4.4.4",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
